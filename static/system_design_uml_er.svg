<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 40px Arial,sans-serif;fill:#123b59}.sub{font:700 27px Arial,sans-serif;fill:#123b59}.head{font:700 21px Arial,sans-serif;fill:#fff}.body{font:400 17px Arial,sans-serif;fill:#17324d}.small{font:400 16px Arial,sans-serif;fill:#3d5d70}.box{stroke:#a9bfce;stroke-width:2;rx:12}.line{stroke:#174a6e;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f4f8fb"/><rect width="1600" height="112" fill="#fff"/><rect y="108" width="1600" height="4" fill="#287aa8"/>
  <text x="800" y="58" text-anchor="middle" class="title">CareerShield AI - UML and ER Design</text><text x="800" y="91" text-anchor="middle" class="small">Current Flask modules, route operations, and SQLite schema</text>

  <text x="400" y="160" text-anchor="middle" class="sub">UML Module / Component View</text>
  <rect x="55" y="205" width="270" height="205" fill="#236b8e" class="box"/><text x="190" y="242" text-anchor="middle" class="head">Flask Route Module</text><text x="75" y="276" class="small" fill="#fff">+ register(), login()</text><text x="75" y="300" class="small" fill="#fff">+ reset_password(), logout()</text><text x="75" y="324" class="small" fill="#fff">+ home(), analyze(), privacy()</text><text x="75" y="348" class="small" fill="#fff">+ email_verification()</text><text x="75" y="372" class="small" fill="#fff">+ website_verification()</text><text x="75" y="396" class="small" fill="#fff">+ history()</text>
  <rect x="390" y="205" width="300" height="170" fill="#e67e22" class="box"/><text x="540" y="242" text-anchor="middle" class="head">Job Analyzer</text><text x="415" y="282" class="body" fill="#fff">+ analyze_job(text)</text><text x="415" y="313" class="body" fill="#fff">ML prediction</text><text x="415" y="344" class="body" fill="#fff">Rule-based warnings</text><text x="415" y="366" class="small" fill="#fff4e8">Risk score and final label</text>
  <rect x="755" y="205" width="300" height="170" fill="#3b8c75" class="box"/><text x="905" y="242" text-anchor="middle" class="head">Analyzer Modules</text><text x="780" y="282" class="body" fill="#fff">+ analyze_job(text)</text><text x="780" y="313" class="body" fill="#fff">+ analyze_resume(text)</text><text x="780" y="344" class="body" fill="#fff">+ verify_email(email)</text><text x="780" y="366" class="small" fill="#eaf8f2">+ verify_website(url)</text>
  <rect x="1120" y="205" width="400" height="170" fill="#123b59" class="box"/><text x="1320" y="242" text-anchor="middle" class="head">history_db.py</text><text x="1145" y="282" class="small" fill="#fff">+ create_table(), create_user()</text><text x="1145" y="310" class="small" fill="#fff">+ get_user(), update_user_password()</text><text x="1145" y="338" class="small" fill="#fff">+ save_analysis(), get_history()</text><text x="1145" y="366" class="small" fill="#dcecf7">SQLite persistence API</text>
  <path d="M325 290 L390 290" class="line"/><path d="M295 410 L295 420 L905 420 L905 375" class="line"/><path d="M310 410 L310 432 L1320 432 L1320 375" class="line"/>
  <text x="357" y="278" text-anchor="middle" class="small">calls</text><text x="800" y="414" text-anchor="middle" class="small">Flask routes also call verification modules and history API</text>

  <text x="800" y="455" text-anchor="middle" class="sub">Entity-Relationship Diagram</text>
  <rect x="100" y="510" width="500" height="290" fill="#fff" class="box"/><rect x="100" y="510" width="500" height="55" fill="#236b8e" class="box"/><text x="350" y="545" text-anchor="middle" class="head">users</text>
  <text x="130" y="605" class="body">id</text><text x="130" y="641" class="body">username</text><text x="130" y="677" class="body">password_hash</text><text x="130" y="713" class="body">created_at</text>
  <text x="330" y="605" class="small">INTEGER PRIMARY KEY AUTOINCREMENT</text><text x="330" y="641" class="small">TEXT NOT NULL UNIQUE</text><text x="330" y="677" class="small">TEXT NOT NULL</text><text x="330" y="713" class="small">TIMESTAMP DEFAULT CURRENT_TIMESTAMP</text>
  <rect x="1000" y="510" width="500" height="290" fill="#fff" class="box"/><rect x="1000" y="510" width="500" height="55" fill="#2b78a9" class="box"/><text x="1250" y="545" text-anchor="middle" class="head">analysis_history</text>
  <text x="1030" y="598" class="body">id</text><text x="1030" y="630" class="body">user_id</text><text x="1030" y="662" class="body">analysis_type</text><text x="1030" y="694" class="body">input_text</text><text x="1030" y="726" class="body">result</text><text x="1030" y="758" class="body">created_at</text>
  <text x="1230" y="598" class="small">INTEGER PRIMARY KEY AUTOINCREMENT</text><text x="1230" y="630" class="small">INTEGER NULL, FK -&gt; users.id</text><text x="1230" y="662" class="small">TEXT NOT NULL</text><text x="1230" y="694" class="small">TEXT NOT NULL</text><text x="1230" y="726" class="small">TEXT NOT NULL (stringified result)</text><text x="1230" y="758" class="small">TIMESTAMP DEFAULT CURRENT_TIMESTAMP</text>
  <path d="M600 655 L1000 655" class="line"/><text x="800" y="640" text-anchor="middle" class="small">one user to zero-or-many records; user_id is nullable</text>
  <text x="800" y="842" text-anchor="middle" class="small">No email or reset token is stored; reset authorization uses CAREERSHIELD_RESET_KEY from the server environment.</text>
</svg>
