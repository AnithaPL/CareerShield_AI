<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareerShield AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="hero auth-hero">
        <div class="logo">🛡️</div>
        <h1>CareerShield <span>AI</span></h1>
        <h2>Secure Career Safety</h2>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-icon">🔐</div>
            <h2>Welcome back</h2>
            <p class="auth-subtitle">Sign in to access your private analysis history.</p>

            {% if error %}
                <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>

                <label for="password">Password</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Show password">
                        <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                            <path class="eye-slash" d="M3 3l18 18"></path>
                        </svg>
                    </button>
                </div>
                <span id="password-status" class="password-status">Password Hidden</span>

                <button type="submit">🔐 Log In</button>
            </form>

            <p class="auth-switch"><a href="{{ url_for('reset_password') }}">Reset password</a></p>
            <p class="auth-switch">New to CareerShield AI? <a href="{{ url_for('register') }}">Create an account</a></p>
        </section>
    </main>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            button.classList.toggle("is-visible", isHidden);
            button.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
            document.getElementById(inputId + "-status").textContent = isHidden ? "Password Visible" : "Password Hidden";
        }
    </script>
</body>
</html>
